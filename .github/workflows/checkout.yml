name: Checkout Workflow

on:
    
    workflow_dispatch:
      inputs:
        environment:
           description: 'Select the env to deploy'
           required: true
           type: choice
           options:
            - dev
            - qa
            - prod



jobs:
      
    clone:
        runs-on: ubuntu-latest 
        steps:
        - name: Clone the Repository    
          uses: actions/checkout@v4
        - name: List the files in repo       
          run: ls
        - name: Select the env   
          run: echo "The selected env is ${{ inputs.environment}}"
        